<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ================= RESET & TOKENS ================= */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-deep:#080B0E;
  --bg-panel:#0F151B;
  --bg-panel-2:#141B22;
  --border:#1E2A33;
  --border-soft:#17212A;
  --text-primary:#EAF3F1;
  --text-muted:#7E97A3;
  --text-dim:#526572;
  --teal:#49E1C4;
  --teal-dim:rgba(73,225,196,0.12);
  --amber:#F4B33C;
  --amber-dim:rgba(244,179,60,0.12);
  --pink:#FF6F97;
  --pink-dim:rgba(255,111,151,0.12);
  --mono:'JetBrains Mono',monospace;
  --sans:'Sora',sans-serif;
  --radius:10px;
  --maxw:1140px;
  --header-h:92px;
}
html{scroll-behavior:smooth;}
body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:var(--sans);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden;}
img,svg{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--teal);color:#03110E;}

/* faint dot-grid backdrop across the whole page */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
  background-size:26px 26px;
  pointer-events:none;
  z-index:0;
}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;position:relative;z-index:1;}
section{position:relative;z-index:1;padding:120px 0;}
@media (max-width:720px){section{padding:80px 0;}}

/* ================= SCROLLBAR ================= */
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-track{background:var(--bg-deep);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--teal-dim);}

/* ================= PRELOADER ================= */
#preloader{position:fixed;inset:0;z-index:9999;pointer-events:auto;transition:visibility .9s ease;}
#preloader.hide{visibility:hidden;pointer-events:none;}
.curtain{
  position:absolute;top:0;bottom:0;width:50%;background:var(--bg-deep);overflow:hidden;
  transition:transform .95s cubic-bezier(.6,0,.15,1);
}
.curtain-left{left:0;}
.curtain-right{right:0;}
#preloader.hide .curtain-left{transform:translateX(-100%);}
#preloader.hide .curtain-right{transform:translateX(100%);}
.preload-bg span{
  position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;
  animation:floatBlob 9s ease-in-out infinite;
}
.curtain-left span:nth-child(1){width:340px;height:340px;background:var(--teal);top:-80px;left:-60px;animation-delay:0s;}
.curtain-left span:nth-child(2){width:220px;height:220px;background:var(--amber);bottom:10%;left:20%;animation-delay:2.6s;}
.curtain-right span:nth-child(1){width:280px;height:280px;background:var(--pink);bottom:-70px;right:-40px;animation-delay:1.4s;}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(24px,-18px) scale(1.12);}}
.preload-content{
  position:fixed;top:50%;left:50%;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:26px;
  transform:translate(-50%,-50%);
  transition:opacity .5s ease, transform .5s ease;
}
#preloader.hide .preload-content{opacity:0;transform:translate(-50%,-50%) scale(.86);}
.preload-ring-wrap{position:relative;width:150px;height:150px;}
.preload-ring{width:100%;height:100%;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--border-soft);stroke-width:4;}
.ring-fill{fill:none;stroke:url(#preload-grad);stroke-width:4;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;filter:drop-shadow(0 0 6px rgba(73,225,196,.5));}
.preload-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
.preload-logo{font-family:var(--mono);font-weight:800;font-size:17px;letter-spacing:.02em;color:var(--text-primary);white-space:nowrap;}
.preload-logo .accent{color:var(--teal);}
.preload-pct{font-family:var(--mono);font-size:11.5px;color:var(--teal);letter-spacing:.05em;}
.boot-box{font-family:var(--mono);color:var(--teal);font-size:14px;width:min(420px,86vw);}
.boot-line{opacity:0;white-space:nowrap;overflow:hidden;margin-bottom:6px;color:var(--text-muted);animation:fadeInLine .5s ease forwards;}
.boot-line span.ok{color:var(--teal);}
@keyframes fadeInLine{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

/* ================= TECH-STACK ZIGZAG â€” MERGED INTO HEADER ================= */
#tech-progress{
  position:absolute;top:0;bottom:0;left:0;width:100%;z-index:0;overflow:hidden;pointer-events:none;
  opacity:.6;transition:left .3s ease, width .3s ease;
}
#tp-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.tp-track-path{fill:none;stroke:var(--border);stroke-width:1.2;opacity:.35;}
.tp-fill-path{fill:none;stroke:url(#tp-grad);stroke-width:1.6;filter:drop-shadow(0 0 3px rgba(73,225,196,.4));opacity:.85;}
.tp-runner{
  position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px 2px rgba(255,255,255,.85),0 0 16px 6px var(--teal-dim);
  transform:translate(-50%,-50%);pointer-events:none;transition:left .08s linear, top .08s linear;
  z-index:3;
}
.tp-icon{
  position:absolute;transform:translate(-50%,-50%);
  width:25px;height:25px;border-radius:50%;
  background:rgba(15,21,27,.65);border:1.3px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--ic,var(--text-dim));font-size:11px;
  opacity:.72;filter:grayscale(15%);
  transition:opacity .35s, filter .35s, transform .35s, border-color .35s, box-shadow .35s, background .35s;
  z-index:1;
}
.tp-icon .tp-tip{
  position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;color:var(--text-dim);white-space:nowrap;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.tp-icon[data-pos="top"] .tp-tip{top:auto;bottom:calc(100% + 6px);}
.tp-icon.active{
  opacity:1;filter:grayscale(0%);
  border-color:var(--ic);
  background:radial-gradient(circle, color-mix(in srgb, var(--ic) 40%, rgba(15,21,27,.7)) 0%, rgba(15,21,27,.7) 100%);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--ic) 25%, transparent), 0 0 14px color-mix(in srgb, var(--ic) 75%, transparent);
}
.tp-icon.pop{animation:tpPop .5s cubic-bezier(.34,1.56,.64,1);}
.tp-icon.active{animation:tpBob 2.8s ease-in-out infinite;}
@keyframes tpPop{0%{transform:translate(-50%,-50%) scale(1);}45%{transform:translate(-50%,-50%) scale(1.5);}100%{transform:translate(-50%,-50%) scale(1);}}
@keyframes tpBob{0%,100%{transform:translate(-50%,-50%) translateY(0);}50%{transform:translate(-50%,-50%) translateY(-2px);}}
@media (max-width:900px){
  .tp-icon{width:18px;height:18px;font-size:8.5px;}
  .tp-icon .tp-tip{display:none;}
}
@media (max-width:600px){
  #tech-progress{opacity:.55;}
}

/* ================= CURSOR ================= */
*, *::before, *::after { cursor:none !important; }
.cursor-arrow{
  position:fixed;top:0;left:0;z-index:9998;pointer-events:none;
  font-family:var(--mono);font-weight:800;font-size:22px;line-height:1;
  color:var(--teal);text-shadow:0 0 10px rgba(73,225,196,.75);
  transform:translate(-2px,-11px);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), color .2s;
}
.cursor-arrow.hovering{
  color:var(--amber);text-shadow:0 0 12px rgba(244,179,60,.8);
  transform:translate(-2px,-11px) scale(1.35);
}
@media (max-width:900px){.cursor-arrow{display:none;}}

/* ================= NAV ================= */
header{
  position:fixed;top:0;left:0;right:0;z-index:500;height:var(--header-h);
  background:rgba(8,11,14,0.78);backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;
}
nav{
  position:relative;z-index:2;width:100%;
  max-width:var(--maxw);margin:0 auto;padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{font-family:var(--mono);font-weight:800;font-size:14.5px;color:var(--text-primary);display:flex;align-items:center;gap:2px;text-shadow:0 1px 6px rgba(0,0,0,.85);}
.brand .path{color:var(--teal);}
.brand .cursor-blink{display:inline-block;width:7px;height:15px;background:var(--teal);margin-left:6px;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.nav-links{display:flex;gap:30px;font-size:13.5px;font-family:var(--mono);}
.nav-links a{color:var(--text-primary);font-weight:700;position:relative;padding:4px 0;transition:color .2s;text-shadow:0 1px 6px rgba(0,0,0,.85);}
.nav-links a.active{color:var(--teal);}
.nav-links a.active::before{width:100%;}
.nav-links a::before{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--teal);transition:width .25s ease;}
.nav-links a:hover{color:var(--teal);}
.nav-links a:hover::before{width:100%;}
.nav-cta{
  font-family:var(--mono);font-size:12.5px;color:var(--bg-deep);background:var(--teal);
  padding:9px 16px;border-radius:6px;font-weight:600;transition:transform .2s, box-shadow .2s;
}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(73,225,196,.5);}
.burger{display:none;flex-direction:column;gap:5px;z-index:600;}
.burger span{width:22px;height:2px;background:var(--text-primary);border-radius:2px;transition:.25s;}
@media (max-width:860px){
  .nav-links{
    position:fixed;top:var(--header-h);right:0;height:calc(100vh - var(--header-h));width:min(280px,74vw);
    background:var(--bg-panel);flex-direction:column;gap:26px;padding:100px 32px;
    border-left:1px solid var(--border);transform:translateX(100%);transition:transform .35s ease;
  }
  .nav-links.open{transform:translateX(0);}
  .burger{display:flex;}
  .nav-cta{display:none;}
}

/* ================= HERO ================= */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:calc(var(--header-h) + 60px);position:relative;}
#particles{position:absolute;inset:0;z-index:0;opacity:.55;}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center;width:100%;}
@media (max-width:900px){.hero-inner{grid-template-columns:1fr;gap:40px;}}
.scroll-cue{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;
  color:var(--text-dim);font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  cursor:pointer;transition:color .2s, opacity .3s;
}
.scroll-cue:hover{color:var(--teal);}
.scroll-cue .chev{
  width:20px;height:20px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg);animation:scrollBounce 1.8s ease-in-out infinite;
}
@keyframes scrollBounce{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.5;}50%{transform:rotate(45deg) translate(5px,5px);opacity:1;}}
@media (max-width:640px){.scroll-cue{display:none;}}
.hero-copy > *{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);}
.hero-copy.in > *{opacity:1;transform:translateY(0);}
.hero-copy.in > *:nth-child(1){transition-delay:.05s;}
.hero-copy.in > *:nth-child(2){transition-delay:.16s;}
.hero-copy.in > *:nth-child(3){transition-delay:.30s;}
.hero-copy.in > *:nth-child(4){transition-delay:.42s;}
.hero-copy.in > *:nth-child(5){transition-delay:.54s;}
.hero-copy.in > *:nth-child(6){transition-delay:.64s;}

.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;
  color:var(--teal);background:var(--teal-dim);border:1px solid rgba(73,225,196,.25);
  padding:6px 12px;border-radius:20px;margin-bottom:22px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(73,225,196,.6);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(73,225,196,.55);}70%{box-shadow:0 0 0 8px rgba(73,225,196,0);}100%{box-shadow:0 0 0 0 rgba(73,225,196,0);}}

.hero h1{
  font-family:var(--mono);font-weight:800;font-size:clamp(40px,6.2vw,74px);line-height:1.02;
  letter-spacing:-.02em;margin-bottom:18px;
}
.hero h1 .last{color:var(--teal);}
.hero .role{font-size:clamp(16px,2vw,20px);color:var(--text-muted);margin-bottom:26px;font-weight:500;}
.hero .role b{color:var(--text-primary);font-weight:600;}
.hero p.desc{max-width:520px;color:var(--text-muted);margin-bottom:34px;font-size:15.5px;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px;}
.btn{
  font-family:var(--mono);font-size:13.5px;font-weight:600;padding:13px 22px;border-radius:8px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .2s ease, box-shadow .2s ease, background .2s;
}
.btn-primary{background:var(--teal);color:#03130F;}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 26px -8px rgba(73,225,196,.55);}
.btn-ghost{border:1px solid var(--border);color:var(--text-primary);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-3px);}
.hero-socials{display:flex;gap:16px;}
.hero-socials a{
  width:38px;height:38px;border:1px solid var(--border);border-radius:8px;display:flex;
  align-items:center;justify-content:center;color:var(--text-muted);transition:.2s;
}
.hero-socials a:hover{color:var(--teal);border-color:var(--teal);transform:translateY(-3px);}

/* terminal card */
.terminal{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.6);
}
.terminal-bar{
  display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bg-panel-2);
  border-bottom:1px solid var(--border);
}
.terminal-bar span{width:11px;height:11px;border-radius:50%;}
.terminal-bar .r{background:#FF6159;}
.terminal-bar .y{background:#FFBD2E;}
.terminal-bar .g{background:#28C840;}
.terminal-bar .title{margin-left:8px;font-family:var(--mono);font-size:11.5px;color:var(--text-dim);}
.terminal-body{padding:22px 20px;font-family:var(--mono);font-size:13.5px;min-height:280px;}
.term-line{color:var(--text-muted);margin-bottom:10px;display:flex;gap:8px;}
.term-line .prompt{color:var(--teal);flex:none;}
.term-out{color:var(--text-primary);margin-bottom:16px;padding-left:18px;}
.term-out.pass{color:var(--teal);}
.typewriter::after{content:'â–';color:var(--teal);animation:blink 1s steps(1) infinite;}

/* ================= MARQUEE STRIP ================= */
.marquee-wrap{
  position:relative;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);
  background:var(--bg-panel);overflow:hidden;padding:16px 0;
}
.marquee-wrap::before,.marquee-wrap::after{
  content:'';position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none;
}
.marquee-wrap::before{left:0;background:linear-gradient(90deg,var(--bg-panel),transparent);}
.marquee-wrap::after{right:0;background:linear-gradient(270deg,var(--bg-panel),transparent);}
.marquee-track{display:flex;gap:46px;width:max-content;animation:marqueeScroll 58s linear infinite;}
.marquee-wrap:hover .marquee-track{animation-play-state:paused;}
.marquee-item{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13.5px;color:var(--text-muted);white-space:nowrap;}
.marquee-item i{font-size:16px;}
@keyframes marqueeScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ================= SECTION HEADERS ================= */
.sec-head{margin-bottom:56px;}
.sec-tag{font-family:var(--mono);font-size:12.5px;color:var(--amber);letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-tag::before{content:'//';color:var(--text-dim);}
.sec-title{font-family:var(--mono);font-weight:700;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.01em;}
.sec-sub{color:var(--text-muted);max-width:560px;margin-top:12px;font-size:15px;}

/* reveal-on-scroll */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
.reveal.in{opacity:1;transform:translateY(0);}

/* ================= ABOUT ================= */
.about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:start;}
@media (max-width:860px){.about-grid{grid-template-columns:1fr;}}
.code-quote{
  font-family:var(--mono);font-size:14.5px;line-height:2;background:var(--bg-panel);
  border:1px solid var(--border);border-radius:10px;padding:26px 24px;position:relative;
}
.code-quote .kw{color:var(--pink);}
.code-quote .fn{color:var(--teal);}
.code-quote .str{color:var(--amber);}
.code-quote .cm{color:var(--text-dim);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.stat-card{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:20px;
  transition:border-color .25s, transform .25s;
}
.stat-card:hover{border-color:var(--teal);transform:translateY(-4px);}
.stat-num{font-family:var(--mono);font-weight:800;font-size:32px;color:var(--teal);}
.stat-num .unit{font-size:18px;}
.stat-label{color:var(--text-muted);font-size:12.5px;margin-top:6px;font-family:var(--mono);}

/* ================= EXPERIENCE / PIPELINE ================= */
/* ================= AMBIENT BACKGROUND BLOBS ================= */
.ambient-blobs{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.ambient-blobs span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.16;will-change:transform;}
#about .ambient-blobs span:nth-child(1){width:340px;height:340px;background:var(--teal);top:-100px;left:-80px;}
#about .ambient-blobs span:nth-child(2){width:260px;height:260px;background:var(--pink);bottom:-60px;right:-40px;}
#skills .ambient-blobs span:nth-child(1){width:300px;height:300px;background:var(--amber);top:10%;right:-100px;}
#skills .ambient-blobs span:nth-child(2){width:260px;height:260px;background:var(--teal);bottom:-80px;left:-60px;}
#contact .ambient-blobs span:nth-child(1){width:320px;height:320px;background:var(--pink);top:-90px;right:-70px;}
#contact .ambient-blobs span:nth-child(2){width:240px;height:240px;background:var(--teal);bottom:-60px;left:-50px;}
#about,#skills,#contact{position:relative;overflow:hidden;}

/* ================= BACK TO TOP ================= */
#back-to-top{
  position:fixed;bottom:26px;left:26px;z-index:800;width:52px;height:52px;
  opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;
  transition:opacity .3s, transform .3s;
}
#back-to-top.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
#back-to-top svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
#back-to-top .btt-track{fill:none;stroke:var(--border);stroke-width:3;}
#back-to-top .btt-fill{fill:none;stroke:url(#tp-grad);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .1s linear;}
#back-to-top button{
  position:absolute;inset:5px;border-radius:50%;background:var(--bg-panel);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:15px;transition:transform .2s, background .2s;
}
#back-to-top button:hover{transform:scale(1.08);background:var(--bg-panel-2);}

/* ================= PIPELINE DRAW-IN ================= */
.pipeline{pos
